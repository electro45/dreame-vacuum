name: Synchro upstream (sans DVC)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexk
          fetch-depth: 0

      - name: Dernière version stable upstream
        id: up
        run: |
          tag=$(gh api repos/Tasshack/dreame-vacuum/releases/latest -q .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "fork=${tag}.1" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}.1" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Déjà à jour (${tag}.1)"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version upstream : $tag"
          fi

      - name: Reconstruire nexk sur la version upstream
        if: steps.up.outputs.new == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          keep=$(mktemp -d)
          cp -r .github/scripts "$keep/scripts"
          cp .github/workflows/sync-upstream.yml FORK.md "$keep/"
          git remote add upstream https://github.com/Tasshack/dreame-vacuum.git
          git fetch --no-tags upstream "refs/tags/${{ steps.up.outputs.tag }}:refs/tags/${{ steps.up.outputs.tag }}"
          git checkout -B nexk "${{ steps.up.outputs.tag }}"
          mkdir -p .github/scripts .github/workflows
          cp -r "$keep/scripts/." .github/scripts/
          cp "$keep/sync-upstream.yml" .github/workflows/
          cp "$keep/FORK.md" .
          python3 .github/scripts/strip_dvc.py "${{ steps.up.outputs.fork }}"
          git add -A
          git commit -m "Retire le frontend DVC obscurci (${{ steps.up.outputs.fork }})" \
                     -m "Base upstream Tasshack ${{ steps.up.outputs.tag }}, traitée par .github/scripts/strip_dvc.py."
          git tag "${{ steps.up.outputs.fork }}"
          git push --force origin nexk
          git push origin "refs/tags/${{ steps.up.outputs.fork }}"

      - name: Publier la release
        if: steps.up.outputs.new == 'true'
        run: |
          gh release create "${{ steps.up.outputs.fork }}" --target nexk \
            --title "${{ steps.up.outputs.fork }} — sans frontend DVC" \
            --notes "Base upstream Tasshack ${{ steps.up.outputs.tag }} ([notes upstream](https://github.com/Tasshack/dreame-vacuum/releases/tag/${{ steps.up.outputs.tag }})). Frontend DVC obscurci retiré automatiquement, voir FORK.md."
